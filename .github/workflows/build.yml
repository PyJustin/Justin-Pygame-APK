name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix Safe Directory permissions for Git
      run: |
        git config --global --add safe.directory /__w/Justin-Pygame-APK/Justin-Pygame-APK

    - name: Patch buildozer.spec and Compile
      run: |
        # 1. Clear out local and hidden environment caches to block bad wheels
        rm -rf .buildozer/
        rm -rf bin/
        rm -rf /github/home/.cache/pip/*
        rm -rf /root/.cache/pip/*

        # 2. Cleanly isolate pycparser into a dedicated directory
        mkdir -p /tmp/p4a_host_deps
        pip install pycparser --target=/tmp/p4a_host_deps --break-system-packages

        if [ -f "buildozer.spec" ]; then
          # 3. FIX: Swapped legacy 'pygame' for 'pygame-ce' to resolve NDK internal toolchain crashes
          sed -i 's|^requirements = .*|requirements = python3==3.10.12,hostpython3==3.10.12,pygame-ce,pyjnius,pycparser,cffi,pymunk|g' buildozer.spec
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
        fi

        # 4. Explicitly route python-for-android to build the community distribution
        export P4A_pygame_ce_version="main"
        export P4A_pygame_ce_url="git+https://github.com"

        # 5. Inject the isolated directory into PYTHONPATH for hostpython3 validation loops
        export PYTHONPATH="/tmp/p4a_host_deps:$PYTHONPATH"

        # 6. Compile the app cleanly 
        yes | buildozer -v android debug
      env:
        BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: "1"
        BUILDOZER_WARN_ON_ROOT: "0"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
