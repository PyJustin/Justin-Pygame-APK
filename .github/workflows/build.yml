name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix Safe Directory permissions for Git
      run: |
        git config --global --add safe.directory /__w/Justin-Pygame-APK/Justin-Pygame-APK

    - name: Patch buildozer.spec and Compile
      run: |
        # Safely overwrite the requirements line inside buildozer.spec so it doesn't default to python 3.14
        if [ -f "buildozer.spec" ]; then
          sed -i 's|^requirements = .*|requirements = python3==3.11.0,hostpython3==3.11.0,pygame-ce,pyjnius|g' buildozer.spec
          
          # Clean up any potential conflicting p4a branch configurations
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
        fi

        # Run buildozer normally without command line flags to let it safely read the modified spec file
        yes | buildozer -v android debug
      env:
        BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: "1"
        BUILDOZER_WARN_ON_ROOT: "0"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error

