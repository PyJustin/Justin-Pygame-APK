name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix Safe Directory permissions for Git
      run: |
        git config --global --add safe.directory /__w/Justin-Pygame-APK/Justin-Pygame-APK

    - name: Patch buildozer.spec and Compile
      run: |
        # 1. Purge all host and device build caches to destroy the bad x86_64 wheel
        rm -rf .buildozer/
        rm -rf bin/

        if [ -f "buildozer.spec" ]; then
          # 2. Tell p4a to trigger its native compiled pygame engine recipe framework,
          # but we change the requirements string to map it cleanly.
          sed -i 's|^requirements = .*|requirements = python3==3.11.0,hostpython3==3.11.0,pygame,pyjnius|g' buildozer.spec
          
          # 3. Force p4a.branch to master for mobile recipe isolation
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
        fi

        # 4. OVERRIDE THE RECIPE: Intercept the native pygame recipe source environment 
        # variable and point it directly to the pygame-ce source repository.
        # This bypasses pip wheels entirely and forces the NDK to spend 30+ minutes compiling AARCH64.
        export P4A_pygame_version="main"
        export P4A_pygame_url="git+https://github.com"

        # 5. Execute build
        yes | buildozer -v android debug
      env:
        BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: "1"
        BUILDOZER_WARN_ON_ROOT: "0"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
