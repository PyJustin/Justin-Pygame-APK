name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Game Code
      uses: actions/checkout@v4

    - name: Fetch Pymunk Build Recipe Natively
      # Uses GitHub's native git action layer to bypass curl/domain bugs entirely
      uses: actions/checkout@v4
      with:
        repository: kivy/python-for-android
        path: p4a-temp
        sparse-checkout: |
          pythonforandroid/recipes/pymunk

    - name: Move Recipe Files into Workspace
      run: |
        mkdir -p p4a-recipes
        mv p4a-temp/pythonforandroid/recipes/pymunk p4a-recipes/
        rm -rf p4a-temp

    - name: Create Native Build Script
      run: |
        cat << 'EOF' > patch_and_build.sh
        #!/bin/bash
        set -e
        
        git config --global --add safe.directory /__w/Justin-Pygame-APK/Justin-Pygame-APK
        rm -rf bin/
        rm -rf /github/home/.cache/pip/*
        rm -rf /root/.cache/pip/*
        
        # 1. Inject prerequisites into the active virtual environment sandbox
        mkdir -p /tmp/p4a_host_deps
        /home/user/.venv/bin/pip install --upgrade pip setuptools wheel
        /home/user/.venv/bin/pip install pycparser cffi cython --target=/tmp/p4a_host_deps
        
        # 2. Match your working requirements baseline
        if [ -f "buildozer.spec" ]; then
          sed -i 's|^requirements = .*|requirements = python3==3.10.12,hostpython3==3.10.12,pygame,pyjnius,pycparser,cffi,pymunk|g' buildozer.spec
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
        fi
        
        # 3. Environment overrides for Pygame-CE and Pymunk Compilation
        export P4A_pygame_version="main"
        export P4A_pygame_url="git+https://github.com"
        export P4A_pymunk_version="6.10.0"
        
        # Fix missing function warnings inside Chipmunk C codebase for Android LLVM
        export CFLAGS="-Wno-implicit-function-declaration -Wno-error=format-security -fPIC"
        export LDFLAGS="-lm"
        
        # 4. Inject the isolated directory into PYTHONPATH
        export PYTHONPATH="/tmp/p4a_host_deps:$PYTHONPATH"
        
        # 5. Clean old build distribution fragments if present
        if [ -d ".buildozer/android/platform/python-for-android" ]; then
          buildozer android clean
        else
          rm -rf .buildozer/
        fi
        
        # 6. Initialize the buildozer platform tools quietly to download structures
        yes | buildozer android p4a -- --help || true
        
        # 7. Override the internal python-for-android recipe directory with our modern script
        P4A_RECIPE_DIR=$(find / -name "recipes" -type d -path "*pythonforandroid*" | head -n 1)
        if [ -d "$P4A_RECIPE_DIR" ] && [ -d "p4a-recipes/pymunk" ]; then
          cp -r p4a-recipes/pymunk "$P4A_RECIPE_DIR/"
        fi
        
        # 8. Compile the app cleanly 
        yes | buildozer -v android debug
        EOF
        chmod +x patch_and_build.sh

    - name: Compile App inside Buildozer Container
      uses: docker://ghcr.io/kivy/buildozer:latest
      with:
        entrypoint: /bin/bash
        args: ./patch_and_build.sh
      env:
        BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: "1"
        BUILDOZER_WARN_ON_ROOT: "0"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
