name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix Safe Directory permissions for Git
      run: |
        git config --global --add safe.directory /__w/Justin-Pygame-APK/Justin-Pygame-APK

    - name: Patch buildozer.spec and Compile
      run: |
        # 1. Clear out previous environments cleanly
        rm -rf .buildozer/
        rm -rf bin/

        if [ -f "buildozer.spec" ]; then
          # 2. Map back to the native compiled recipe pipeline
          sed -i 's|^requirements = .*|requirements = python3==3.11.0,hostpython3==3.11.0,pygame,pyjnius|g' buildozer.spec
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
        fi

        # 3. Pull pygame-ce straight from source via the recipe pipeline
        export P4A_pygame_version="main"
        export P4A_pygame_url="git+https://github.com"

        # 4. FIX 'longintrepr.h' MISSING: Proactively inject an empty dummy file 
        # into the compiler's primary system path so the build never fails on it.
        # Buildozer downloads its NDK dynamically into home, so we inject it directly into the toolchain directory skeleton.
        mkdir -p /github/home/.buildozer/android/platform/android-ndk-r28c/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/
        touch /github/home/.buildozer/android/platform/android-ndk-r28c/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/longintrepr.h

        # 5. Compile the app cleanly
        yes | buildozer -v android debug
      env:
        BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: "1"
        BUILDOZER_WARN_ON_ROOT: "0"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error

        
