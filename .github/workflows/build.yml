name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libtool \
            autoconf \
            automake \
            pkg-config \
            gawk \
            git \
            ccache \
            unzip \
            zip \
            bzip2 \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            libstdc++6 \
            aidl

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Inject Native SDK Paths & Compile
        run: |
          # 1. Automatically accept all licenses on the runner's native Android framework
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

          # 2. Force append configuration variables onto your buildozer.spec file dynamically.
          # This tells Buildozer to reuse GitHub's robust pre-configured Android SDK and NDK,
          # completely disabling its custom internal automated downloader and avoiding path errors.
          if [ -f "buildozer.spec" ]; then
            sed -i "s|#android.sdk_path =|android.sdk_path = $ANDROID_HOME|g" buildozer.spec
            sed -i "s|#android.ndk_path =|android.ndk_path = $ANDROID_NDK_HOME|g" buildozer.spec
          fi

          # 3. Trigger compilation using the runner's system resources
          buildozer -v android debug
        env:
          BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: 1
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: .bin/*.apk
