name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libtool \
            autoconf \
            automake \
            pkg-config \
            gawk \
            git \
            ccache \
            unzip \
            zip \
            bzip2 \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            libstdc++6 \
            aidl

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Provision Legacy Android SDK Tools & Compile
        run: |
          # 1. Manually construct the precise legacy paths Buildozer searches for
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR"
          cd "$SDK_DIR"

          # 2. Download the last official legacy tools zip that uses the 'tools/bin/sdkmanager' structure
          curl -L -o sdk-tools.zip https://dl.google.com/android/repository/sdk-tools-linux-4333796.zip
          unzip -q sdk-tools.zip
          rm sdk-tools.zip

          # 3. Create structural directories and manually pre-accept Google licenses
          mkdir -p "$SDK_DIR/licenses"
          echo -e "8933bad161d7a78a6f3542316664d6c2813e1130\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_DIR/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f291d" > "$SDK_DIR/licenses/android-sdk-preview-license"
          
          # Return to the project root directory
          cd $GITHUB_WORKSPACE

          # 4. Trigger Buildozer natively now that its path dependencies exist
          buildozer -v android debug
        env:
          BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: 1
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: .bin/*.apk

