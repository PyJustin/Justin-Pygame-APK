name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Game Code
      uses: actions/checkout@v4

    - name: Set up System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libgdbm-dev libssl-dev libffi-dev cmake gettext \
          libltdl-dev apksigner ccache openjdk-17-jdk

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Build Dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install buildozer cython

    - name: Patch buildozer.spec and Compile Natively
      run: |
        rm -rf bin/
        rm -rf ~/.cache/pip/*

        # 1. Keep your working pre-bundled Pymunk wheel layout
        pip install --target=. pycparser cffi pymunk==6.10.0

        if [ -f "buildozer.spec" ]; then
          # 2. Fix the Python target versions to keep C-compilation stable
          sed -i 's|^requirements = .*|requirements = python3==3.10.12,hostpython3==3.10.12,pygame,pyjnius|g' buildozer.spec
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
          sed -i 's|^p4a.local_recipes =.*||g' buildozer.spec
          
          # 3. Comment out old SDK configuration lines to clear the space
          sed -i 's|^android.api =|# android.api =|g' buildozer.spec
          sed -i 's|^android.minapi =|# android.minapi =|g' buildozer.spec
          sed -i 's|^android.ndk_api =|# android.ndk_api =|g' buildozer.spec
          sed -i 's|^android.build_tools =|# android.build_tools =|g' buildozer.spec
          sed -i 's|^android.gradle_version =|# android.gradle_version =|g' buildozer.spec
          
          # 4. FIX GRADLE ASSEMBLY: Append exact target parameters to the very end of the file.
          # Explicitly pinning build_tools to 34.0.0 keeps Gradle 8.0 from crashing.
          echo "" >> buildozer.spec
          echo "[app:android]" >> buildozer.spec
          echo "android.api = 34" >> buildozer.spec
          echo "android.build_tools = 34.0.0" >> buildozer.spec
          echo "android.minapi = 24" >> buildozer.spec
          echo "android.ndk_api = 24" >> buildozer.spec
          echo "android.gradle_version = 8.0" >> buildozer.spec
        fi

        # 5. Pull Python 3.10 source trees safely via GitHub infrastructure mirrors
        export P4A_pygame_version="main"
        export P4A_pygame_url="git+https://github.com"
        export P4A_python3_url="https://github.com"
        
        # Relax compilation strictness for static C bindings
        export CFLAGS="-Wno-implicit-function-declaration -Wno-error=format-security -fPIC"
        export LDFLAGS="-lm"

        # 6. Compile the app cleanly
        yes | buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
