name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Game Code
      uses: actions/checkout@v4

    - name: Fetch Pymunk Build Recipe Natively
      uses: actions/checkout@v4
      with:
        repository: kivy/python-for-android
        path: p4a-temp
        sparse-checkout: |
          pythonforandroid/recipes/pymunk

    - name: Move Recipe Files into Workspace
      run: |
        mkdir -p p4a-recipes
        mv p4a-temp/pythonforandroid/recipes/pymunk p4a-recipes/
        rm -rf p4a-temp

    - name: Set up System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libgdbm-dev libssl-dev libffi-dev cmake gettext \
          libltdl-dev apksigner ccache openjdk-17-jdk

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Build Dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install buildozer cython

    - name: Patch buildozer.spec and Compile Natively
      run: |
        rm -rf bin/
        rm -rf ~/.cache/pip/*

        # 1. FIX: Clean out any lingering static local wheel folders from yesterday's pipeline step
        rm -rf pymunk/ cffi/ pycparser/ *.egg-info/

        if [ -f "buildozer.spec" ]; then
          # 2. FIX: Force p4a to cross-compile target wheels for cffi/pymunk to generate '_cffi_backend'
          sed -i 's|^requirements = .*|requirements = python3==3.10.12,hostpython3==3.10.12,pygame,pyjnius,pycparser,cffi,pymunk|g' buildozer.spec
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
          
          # Link your local clean p4a recipe directory
          sed -i 's|^#\?p4a.local_recipes =.*|p4a.local_recipes = ./p4a-recipes|g' buildozer.spec
          
          # 3. Strip out old or duplicated SDK configurations cleanly
          sed -i '/^android.api =/d; /^# android.api =/d' buildozer.spec
          sed -i '/^android.minapi =/d; /^# android.minapi =/d' buildozer.spec
          sed -i '/^android.ndk_api =/d; /^# android.ndk_api =/d' buildozer.spec
          sed -i '/^android.build_tools =/d; /^# android.build_tools =/d' buildozer.spec
          sed -i '/^android.gradle_version =/d; /^# android.gradle_version =/d' buildozer.spec
          
          # 4. Append options directly into the main config frame
          echo "" >> buildozer.spec
          echo "android.api = 34" >> buildozer.spec
          echo "android.build_tools = 34.0.0" >> buildozer.spec
          echo "android.minapi = 24" >> buildozer.spec
          echo "android.ndk_api = 24" >> buildozer.spec
          echo "android.gradle_version = 8.0" >> buildozer.spec
        fi

        # 5. Route your custom source distributions cleanly
        export P4A_pygame_version="main"
        export P4A_pygame_url="git+https://github.com"
        export P4A_python3_url="https://github.com"
        
        # 6. Force the global environment shell to use Java 17 for Gradle compliance
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        export PATH=$JAVA_HOME/bin:$PATH

        # Relax compilation rules for static C bindings
        export CFLAGS="-Wno-implicit-function-declaration -Wno-error=format-security -fPIC"
        export LDFLAGS="-lm"

        # 7. FIX: Bootstrap buildozer to safely unpack the hostpython toolchain framework source files
        yes | buildozer android p4a -- --help || true

        # 8. FIX: Inject pycparser straight inside hostpython3's internal source site-packages folder
        # This stops the old 'ModuleNotFoundError' when p4a evaluates your custom recipes!
        HOST_PYTHON_SRC=$(find .buildozer/ -name "hostpython3" -type d -path "*other_builds*" | head -n 1)
        if [ -d "$HOST_PYTHON_SRC" ]; then
          echo "Injecting helper parsing tools into hostpython path: $HOST_PYTHON_SRC"
          pip install pycparser cffi --target="$HOST_PYTHON_SRC/desktop/hostpython3/native-build/root/usr/local/lib/python3.10/site-packages" --break-system-packages || true
        fi

        # 9. Build the full native package
        yes | buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
