name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Run the entire job inside the official Kivy Buildozer image
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix Safe Directory permissions for Git
      run: |
        git config --global --add safe.directory /__w/Justin-Pygame-APK/Justin-Pygame-APK

    - name: Build APK with Buildozer
      run: |
        # Strip out deprecated or mismatched configurations dynamically
        if [ -f "buildozer.spec" ]; then
          sed -i 's|^requirements = .*|requirements = python3,pygame,pyjnius|g' buildozer.spec
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
          sed -i '/android.bootstrap/d' buildozer.spec
          sed -i '/p4a.bootstrap/d' buildozer.spec
          sed -i '/\[app\]/a p4a.bootstrap = sdl2' buildozer.spec
        fi

        # Execute build using standard arguments
        buildozer -v android debug --android.archs="arm64-v8a"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
