name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libtool \
          autoconf \
          automake \
          pkg-config \
          gawk \
          git \
          ccache \
          unzip \
          zip \
          bzip2 \
          libffi-dev \
          libssl-dev \
          libltdl-dev \
          libstdc++6

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython wheel

    - name: Force Purge Buildozer and Pip Caches
      run: |
        rm -rf .buildozer/
        rm -rf ~/.buildozer/
        rm -rf ~/.cache/pip

    - name: Link Legacy SDK Paths & Compile
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        sudo mkdir -p "$ANDROID_HOME/tools/bin"
        sudo ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"
        
        # Inject standard SDK/NDK paths into buildozer.spec if present
        if [ -f "buildozer.spec" ]; then
          sed -i "s|#android.sdk_path =|android.sdk_path = $ANDROID_HOME|g" buildozer.spec
          sed -i "s|#android.ndk_path =|android.ndk_path = $ANDROID_NDK_HOME|g" buildozer.spec
        fi
        
        export APP_ANDROID_ARCHS="arm64-v8a"
        
        # Compile using the default native pipeline
        buildozer -v android debug
      env:
        BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: 1
        BUILDOZER_WARN_ON_ROOT: 0

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: |
          .bin/*.apk
          bin/*.apk
        if-no-files-found: error

