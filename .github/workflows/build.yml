name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix Safe Directory permissions for Git
      run: |
        git config --global --add safe.directory /__w/Justin-Pygame-APK/Justin-Pygame-APK

    - name: Patch buildozer.spec and Compile via toolchain
      run: |
        # 1. Clear out local and hidden environment caches to block bad wheels
        rm -rf bin/
        rm -rf /github/home/.cache/pip/*
        rm -rf /root/.cache/pip/*

        # 2. Inject compilation dependencies right inside the active virtual environment sandbox
        /home/user/.venv/bin/pip install --upgrade pip setuptools wheel
        /home/user/.venv/bin/pip install pycparser cffi cython

        if [ -f "buildozer.spec" ]; then
          # 3. Match your exact working requirements line
          sed -i 's|^requirements = .*|requirements = python3==3.10.12,hostpython3==3.10.12,pygame,pyjnius,pymunk|g' buildozer.spec
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
        fi

        # 4. Point the native pygame recipe to pull down your working Pygame-CE source code
        export P4A_pygame_version="main"
        export P4A_pygame_url="git+https://github.com"

        # 5. Force install modern NDK-compliant Pymunk source distributions
        export P4A_pymunk_version="6.10.0"

        # 6. Relax compilation strictness for Pymunk's internal C-bindings
        export CFLAGS="-Wno-implicit-function-declaration -Wno-error=format-security"

        # 7. FIX: Force Buildozer to completely download the NDK, SDK, and p4a framework files
        # Running 'buildozer android p4a -- --help' downloads all necessary directories.
        yes | buildozer android p4a -- --help || true

        # 8. FIX: Dynamically locate the python-for-android directory in the workspace
        # This completely avoids hardcoded path errors.
        P4A_DIR=$(find / -name "pythonforandroid" -type d -path "*python-for-android*" | head -n 1)
        if [ -z "$P4A_DIR" ]; then
          # Fallback check if it's placed inside the local project folder
          P4A_DIR=$(find . -name "pythonforandroid" -type d | head -n 1)
        fi
        
        # Navigate up one directory level to access the main python-for-android toolchain parent directory
        cd "$P4A_DIR/.."

        # 9. Use the direct pythonforandroid toolchain engine to compile the app
        /home/user/.venv/bin/python3 -m pythonforandroid.toolchain apk \
          --bootstrap=sdl2 \
          --dist_name=myappfunwithpymunk \
          --requirements=python3==3.10.12,hostpython3==3.10.12,pygame,pyjnius,pycparser,cffi,pymunk \
          --arch=arm64-v8a \
          --storage-dir=/__w/Justin-Pygame-APK/Justin-Pygame-APK/.buildozer/android/platform/build-arm64-v8a \
          --ndk-api=31 \
          --private=/__w/Justin-Pygame-APK/Justin-Pygame-APK \
          --color=always \
          --debug

        # 10. Map completed output package directly back to your bin folder for export
        mkdir -p /__w/Justin-Pygame-APK/Justin-Pygame-APK/bin
        cp *.apk /__w/Justin-Pygame-APK/Justin-Pygame-APK/bin/ || true
      env:
        BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: "1"
        BUILDOZER_WARN_ON_ROOT: "0"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
