name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libtool \
            autoconf \
            automake \
            pkg-config \
            gawk \
            git \
            ccache \
            unzip \
            zip \
            bzip2 \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            libstdc++6 \
            aidl

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Link Native Android SDK & Compile
        run: |
          # 1. Establish the clean destination folder Buildozer looks for
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR"

          # 2. Safely accept the Android system framework licenses pre-installed on the runner
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

          # 3. Create structural symlinks making the runner's pre-configured tools discoverable by Buildozer
          ln -s "$ANDROID_HOME/cmdline-tools" "$SDK_DIR/cmdline-tools"
          ln -s "$ANDROID_HOME/platform-tools" "$SDK_DIR/platform-tools"
          
          # 4. Buildozer fallback compatibility link: map standard legacy path to modern binary directory
          mkdir -p "$SDK_DIR/tools"
          ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" "$SDK_DIR/tools/bin"

          # 5. Execute Buildozer build
          buildozer -v android debug
        env:
          BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: 1
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: .bin/*.apk
