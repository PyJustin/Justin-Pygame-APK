name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Game Code
      uses: actions/checkout@v4

    - name: Fetch Pymunk Build Recipe Natively
      uses: actions/checkout@v4
      with:
        repository: kivy/python-for-android
        path: p4a-temp
        sparse-checkout: |
          pythonforandroid/recipes/pymunk

    - name: Move Recipe Files into Workspace
      run: |
        mkdir -p p4a-recipes
        mv p4a-temp/pythonforandroid/recipes/pymunk p4a-recipes/
        rm -rf p4a-temp

    - name: Set up System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libgdbm-dev libssl-dev libffi-dev cmake gettext \
          libltdl-dev apksigner ccache openjdk-17-jdk

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Build Dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install buildozer cython

    - name: Patch buildozer.spec and Compile Natively
      run: |
        rm -rf bin/
        rm -rf ~/.cache/pip/*
        rm -rf pymunk/ cffi/ pycparser/ *.egg-info/

        # 1. FIX: Patch the local Pymunk recipe to declare its host requirements.
        # This tells python-for-android to cross-compile pycparser and cffi straight into 
        # hostpython3 natively as part of its internal build pipeline!
        if [ -f "p4a-recipes/pymunk/__init__.py" ]; then
          echo "Injecting host_dependencies into local Pymunk recipe class..."
          sed -i "s|class PymunkRecipe(|class PymunkRecipe(\n    host_dependencies = ['pycparser', 'cffi']\n|g" p4a-recipes/pymunk/__init__.py
        fi

        if [ -f "buildozer.spec" ]; then
          # 2. Enforce python-for-android target requirements
          sed -i 's|^requirements = .*|requirements = python3==3.10.12,hostpython3==3.10.12,pygame,pyjnius,pycparser,cffi,pymunk|g' buildozer.spec
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
          sed -i 's|^#\?p4a.local_recipes =.*|p4a.local_recipes = ./p4a-recipes|g' buildozer.spec
          
          # 3. Clean up old configuration tokens
          sed -i '/^android.api =/d; /^# android.api =/d' buildozer.spec
          sed -i '/^android.minapi =/d; /^# android.minapi =/d' buildozer.spec
          sed -i '/^android.ndk_api =/d; /^# android.ndk_api =/d' buildozer.spec
          sed -i '/^android.build_tools =/d; /^# android.build_tools =/d' buildozer.spec
          sed -i '/^android.gradle_version =/d; /^# android.gradle_version =/d' buildozer.spec
          
          # 4. Append proper production packaging parameters
          echo "" >> buildozer.spec
          echo "android.api = 34" >> buildozer.spec
          echo "android.build_tools = 34.0.0" >> buildozer.spec
          echo "android.minapi = 24" >> buildozer.spec
          echo "android.ndk_api = 24" >> buildozer.spec
          echo "android.gradle_version = 8.0" >> buildozer.spec
        fi

        # 5. Route source downloads safely via GitHub mirrors
        export P4A_pygame_version="main"
        export P4A_pygame_url="git+https://github.com"
        export P4A_python3_url="https://github.com"
        
        # 6. Fast-track Java tool environments
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        export PATH=$JAVA_HOME/bin:$PATH
        export CFLAGS="-Wno-implicit-function-declaration -Wno-error=format-security -fPIC"
        export LDFLAGS="-lm"

        # 7. Run the clean compilation pass
        yes | buildozer -v android debug
