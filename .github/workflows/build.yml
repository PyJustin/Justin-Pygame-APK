name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Run natively inside the official Kivy Buildozer container image
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix Safe Directory permissions for Git
      run: |
        git config --global --add safe.directory /__w/Justin-Pygame-APK/Justin-Pygame-APK

    - name: Build APK with Stable Python & Pygame-CE
      run: |
        # Feeding requirements and extra_recipes directly as flags so buildozer applies them together
        # This locks compilation to Python 3.11 to prevent Python 3.14 alpha crashes
        yes | buildozer -v android debug \
          --android.requirements="python3==3.11.0,hostpython3==3.11.0,pygame-ce,pyjnius" \
          --p4a.extra_recipes="pygame-ce" \
          --p4a.branch="master" \
          --p4a.bootstrap="sdl2" \
          --android.archs="arm64-v8a"
      env:
        # Bypasses the interactive root user container confirmation prompts
        BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: "1"
        BUILDOZER_WARN_ON_ROOT: "0"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
