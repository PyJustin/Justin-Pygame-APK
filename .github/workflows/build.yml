name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libtool \
          autoconf \
          automake \
          pkg-config \
          gawk \
          git \
          ccache \
          unzip \
          zip \
          bzip2 \
          libffi-dev \
          libssl-dev \
          libltdl-dev \
          libstdc++6 \
          libgtk-3-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          zlib1g-dev \
          cmake

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Stable Buildozer Environment
      run: |
        python -m pip install --upgrade pip
        pip install "buildozer==1.5.0" "cython<3.0.0" wheel "sh<2.0"

    - name: Force Purge Buildozer and Pip Caches
      run: |
        rm -rf .buildozer/
        rm -rf ~/.buildozer/
        rm -rf ~/.cache/pip

    - name: Link Legacy SDK Paths & Compile
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        sudo mkdir -p "$ANDROID_HOME/tools/bin"
        sudo ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"
        
        # Rewrite buildozer.spec safely using a robust Python parsing script
        python3 -c "
import configparser

config = configparser.ConfigParser(allow_no_value=True, strict=False)
config.read('buildozer.spec', encoding='utf-8')

# Ensure sections exist and update values safely
if not config.has_section('app'):
    config.add_section('app')

config.set('app', 'android.sdk_path', '$ANDROID_HOME')
config.set('app', 'android.ndk_path', '$ANDROID_NDK_HOME')
config.set('app', 'requirements', 'python3,pygame,pyjnius')
config.set('app', 'p4a.branch', 'master')
config.set('app', 'p4a.bootstrap', 'sdl2')

# Remove duplicate properties from unintended sections if they exist
if config.has_section('buildozer'):
    config.remove_option('buildozer', 'p4a.bootstrap')
    config.remove_option('buildozer', 'android.bootstrap')

with open('buildozer.spec', 'w', encoding='utf-8') as f:
    config.write(f)
"
        
        # Build using specific target parameters to force standard C compilation routines
        buildozer -v android debug --android.archs=arm64-v8a
      env:
        BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: 1
        BUILDOZER_WARN_ON_ROOT: 0

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error

