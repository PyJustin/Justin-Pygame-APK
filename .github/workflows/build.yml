name: Build Android App with Buildozer

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Game Code
      uses: actions/checkout@v4

    - name: Set up System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libgdbm-dev libssl-dev libffi-dev cmake gettext \
          libltdl-dev apksigner ccache openjdk-17-jdk

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Build Dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install buildozer cython

    - name: Patch buildozer.spec and Compile Natively
      run: |
        echo "Executing Buildozer Deep Clean Routine..."
        if command -v buildozer &> /dev/null; then
          buildozer android clean || true
        fi
        rm -rf .buildozer/
        rm -rf ~/.buildozer/
        rm -rf bin/
        rm -rf ~/.cache/pip/*
        rm -rf pymunk/ cffi/ pycparser/ *.egg-info/ p4a-recipes/ cffi.py libs/

        if [ -f "buildozer.spec" ]; then
          sed -i 's|^requirements = .*|requirements = python3==3.10.12,hostpython3==3.10.12,pygame,pyjnius|g' buildozer.spec
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
          sed -i 's|^p4a.local_recipes =.*||g' buildozer.spec
          sed -i 's|^pip_dependencies =.*||g' buildozer.spec
          
          sed -i '/^android.api =/d; /^# android.api =/d' buildozer.spec
          sed -i '/^android.minapi =/d; /^# android.minapi =/d' buildozer.spec
          sed -i '/^android.ndk_api =/d; /^# android.ndk_api =/d' buildozer.spec
          sed -i '/^android.build_tools =/d; /^# android.build_tools =/d' buildozer.spec
          sed -i '/^android.gradle_version =/d; /^# android.gradle_version =/d' buildozer.spec
          sed -i '/^source.include_exts =/d; /^# source.include_exts =/d' buildozer.spec
          
          echo "" >> buildozer.spec
          echo "android.api = 34" >> buildozer.spec
          echo "android.build_tools = 34.0.0" >> buildozer.spec
          echo "android.minapi = 24" >> buildozer.spec
          echo "android.ndk_api = 24" >> buildozer.spec
          echo "android.gradle_version = 8.0" >> buildozer.spec
          echo "source.include_exts = py,png,jpg,ttf" >> buildozer.spec
        fi

        export P4A_pip_upgrade="1"
        export P4A_pygame_version="main"
        export P4A_pygame_url="git+https://github.com"
        export P4A_python3_url="https://github.com"
        
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        export PATH=$JAVA_HOME/bin:$PATH
        export CFLAGS="-Wno-implicit-function-declaration -Wno-error=format-security -fPIC"
        export LDFLAGS="-lm"

        yes | buildozer android p4a -- --help || true
        pip install --target=. pymunk==5.7.0 --no-deps
        
        if [ -f "pymunk/__init__.py" ]; then
          echo "Patching Pymunk initialization architecture..."
          sed -i 's|from . import _chipmunk_cffi|# from . import _chipmunk_cffi|g' pymunk/__init__.py
          sed -i 's|chipmunk_cff = _chipmunk_cffi.ffi|# chipmunk_cff = _chipmunk_cffi.ffi|g' pymunk/__init__.py
          sed -i "s|cp = _chipmunk_cffi.lib|from . import _chipmunk_cffi_abi as _c_abi\n_chipmunk_cffi = _c_abi\nchipmunk_cff = _c_abi\ncp = _c_abi|g" pymunk/__init__.py
        fi

        if [ -f "pymunk/_chipmunk_cffi_abi.py" ]; then
          echo "Hard-patching secondary CFFI dependencies..."
          sed -i '1465s|.*|pass|' pymunk/_chipmunk_cffi_abi.py
          sed -i 's|ffi = cffi.FFI()|ffi = None|g' pymunk/_chipmunk_cffi_abi.py
        fi

        yes | buildozer -v android debug

        ls -la bin/
        if [ ! -f bin/*.apk ] && [ ! -f bin/*.aab ]; then
          echo "ERROR: No APK package generated!"
          exit 1
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
