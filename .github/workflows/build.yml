name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Run natively inside the official Kivy Buildozer image
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix Safe Directory permissions for Git
      run: |
        git config --global --add safe.directory /__w/Justin-Pygame-APK/Justin-Pygame-APK

    - name: Build APK with Buildozer Overrides
      run: |
        # We pass arguments via the command line to override the spec file
        # This completely avoids editing text files and circumvents any DuplicateOptionError crash
        buildozer -v android debug \
          --android.requirements="python3,pygame,pyjnius" \
          --p4a.branch="master" \
          --p4a.bootstrap="sdl2" \
          --android.archs="arm64-v8a"
