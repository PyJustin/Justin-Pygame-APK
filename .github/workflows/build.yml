name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix Safe Directory permissions for Git
      run: |
        git config --global --add safe.directory /__w/Justin-Pygame-APK/Justin-Pygame-APK

    - name: Patch buildozer.spec and Compile
      run: |
        # 1. Clear out local and hidden environment caches to block bad wheels
        rm -rf .buildozer/
        rm -rf bin/
        rm -rf /github/home/.cache/pip/*
        rm -rf /root/.cache/pip/*

        # 2. Pre-seed the system environment
        pip install --upgrade pip setuptools wheel --break-system-packages
        pip install pycparser cffi cython --break-system-packages

        if [ -f "buildozer.spec" ]; then
          # 3. FIX Python Version & Set Pymunk Requirements
          sed -i 's|^requirements = .*|requirements = python3==3.10.12,hostpython3==3.10.12,pygame,pyjnius,pycparser,cffi,pymunk|g' buildozer.spec
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
        fi

        # 4. Explicitly pull pygame-ce source distributions via recipe parameters
        export P4A_pygame_version="main"
        export P4A_pygame_url="git+https://github.com"

        # 5. FORCE INJECT pycparser directly into the internal build toolchain's virtual environment path
        # This breaks the hostpython isolation and bypasses the metadata generation error.
        mkdir -p /root/.local/share/python-for-android/buildpackages
        pip install pycparser cffi --target=/root/.local/share/python-for-android/buildpackages --break-system-packages

        # 6. Compile the app cleanly 
        yes | buildozer -v android debug
      env:
        BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: "1"
        BUILDOZER_WARN_ON_ROOT: "0"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
