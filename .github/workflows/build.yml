name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix Safe Directory permissions for Git
      run: |
        git config --global --add safe.directory /__w/Justin-Pygame-APK/Justin-Pygame-APK

    - name: Patch buildozer.spec and Compile
      run: |
        # 1. Clear out previous environments cleanly
        rm -rf .buildozer/
        rm -rf bin/

        if [ -f "buildozer.spec" ]; then
          # 2. Map back to the native compiled recipe pipeline
          sed -i 's|^requirements = .*|requirements = python3==3.11.0,hostpython3==3.11.0,pygame,pyjnius|g' buildozer.spec
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
        fi

        # 3. Pull pygame-ce straight from source via the recipe pipeline
        export P4A_pygame_version="main"
        export P4A_pygame_url="git+https://github.com"

        # 4. EXPLICIT SOURCE PATCH: Pre-download the source or force python-for-android
        # to clone it, then immediately strip the hardcoded longintrepr.h from the C source
        # before the NDK compiler runs.
        mkdir -p .buildozer/android/platform/build-arm64-v8a/build/other_builds/pygame/arm64-v8a__ndk_target_31/pygame/
        git clone --depth 1 -b main https://github.com .buildozer/android/platform/build-arm64-v8a/build/other_builds/pygame/arm64-v8a__ndk_target_31/pygame/ || true
        
        # Modify the offending C file to remove the broken header inclusion safely
        if [ -f ".buildozer/android/platform/build-arm64-v8a/build/other_builds/pygame/arm64-v8a__ndk_target_31/pygame/src_c/_sdl2/sdl2.c" ]; then
          sed -i 's|#include "longintrepr.h"|/* #include "longintrepr.h" */|g' .buildozer/android/platform/build-arm64-v8a/build/other_builds/pygame/arm64-v8a__ndk_target_31/pygame/src_c/_sdl2/sdl2.c
        fi

        # 5. Compile the app cleanly
        yes | buildozer -v android debug
      env:
        BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: "1"
        BUILDOZER_WARN_ON_ROOT: "0"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
