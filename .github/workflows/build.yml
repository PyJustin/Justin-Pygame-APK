name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix Safe Directory permissions for Git
      run: |
        git config --global --add safe.directory /__w/Justin-Pygame-APK/Justin-Pygame-APK

    - name: Patch buildozer.spec and Compile
      run: |
        # 1. Clear out any previous build caches completely inside the container workspace
        rm -rf .buildozer/
        rm -rf bin/

        if [ -f "buildozer.spec" ]; then
          # 2. Forcefully inject pygame-ce and Python 3.11 straight into your spec requirements
          sed -i 's|^requirements = .*|requirements = python3==3.11.0,hostpython3==3.11.0,pygame-ce,pyjnius|g' buildozer.spec
          
          # 3. Enforce the master branch to pull stable recipes
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
        fi

        # 4. Trigger a strict clean of previous package compiles to purge old cached target architectures
        buildozer android clean

        # 5. Run buildozer natively to re-compile pygame-ce directly for arm64-v8a
        yes | buildozer -v android debug
      env:
        BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: "1"
        BUILDOZER_WARN_ON_ROOT: "0"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error

