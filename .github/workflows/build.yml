name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix Safe Directory permissions for Git
      run: |
        git config --global --add safe.directory /__w/Justin-Pygame-APK/Justin-Pygame-APK

    - name: Patch buildozer.spec and Compile
      run: |
        # 1. Clear project and hidden pip caches completely 
        rm -rf .buildozer/
        rm -rf bin/
        rm -rf /github/home/.cache/pip/*
        rm -rf /root/.cache/pip/*

        if [ -f "buildozer.spec" ]; then
          # 2. Bind to the native compiled recipe pipeline framework
          sed -i 's|^requirements = .*|requirements = python3==3.11.0,hostpython3==3.11.0,pygame,pyjnius|g' buildozer.spec
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
        fi

        # 3. Pull pygame-ce straight from source via the recipe pipeline
        export P4A_pygame_version="main"
        export P4A_pygame_url="git+https://github.com"

        # 4. FIX 'longintrepr.h' BYPASS VIA CFLAGS:
        # Instead of a dummy file, we define Py_BUILD_CORE which tells the Python headers 
        # to expose the internal struct layout without looking for the standalone longintrepr.h file.
        export CFLAGS="-DPy_BUILD_CORE=1"

        # 5. Compile the app cleanly
        yes | buildozer -v android debug
      env:
        BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: "1"
        BUILDOZER_WARN_ON_ROOT: "0"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
