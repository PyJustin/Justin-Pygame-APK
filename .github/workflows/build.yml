name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix Safe Directory permissions for Git
      run: |
        git config --global --add safe.directory /__w/Justin-Pygame-APK/Justin-Pygame-APK

    - name: Patch buildozer.spec and Compile
      run: |
        # 1. Wipe out any bad cached wheels from previous runs
        rm -rf .buildozer/
        rm -rf bin/

        if [ -f "buildozer.spec" ]; then
          # 2. Set strict requirements
          sed -i 's|^requirements = .*|requirements = python3==3.11.0,hostpython3==3.11.0,pygame-ce,pyjnius|g' buildozer.spec
          
          # 3. Use stable mobile recipes
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
          
          # 4. FORCE BUILD FROM SOURCE: Tell buildozer's pip installer to ignore wheels ONLY for pygame-ce
          # This appends the raw pip flag directly inside the spec file execution loop
          sed -i 's|^#\?p4a.extra_pip_arguments =.*|p4a.extra_pip_arguments = --no-binary=pygame-ce|g' buildozer.spec
        fi

        # 5. Run the build cleanly without global environment overrides
        yes | buildozer -v android debug
      env:
        BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: "1"
        BUILDOZER_WARN_ON_ROOT: "0"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
