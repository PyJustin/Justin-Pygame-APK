name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Game Code
      uses: actions/checkout@v4

    - name: Set up System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libgdbm-dev libssl-dev libffi-dev cmake gettext \
          libltdl-dev apksigner ccache openjdk-17-jdk

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Build Dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install buildozer cython

    - name: Patch buildozer.spec and Inject Runtime Bootstrap
      run: |
        rm -rf bin/
        rm -rf ~/.cache/pip/*
        rm -rf pymunk/ cffi/ pycparser/ *.egg-info/ p4a-recipes/

        # 1. FIX: Inject an automated dependency bootstrapper directly at the top of your main.py file.
        # This forces the Android app to natively unpack and mount Pymunk on launch,
        # completely sidestepping Buildozer's broken compilation environment blocks!
        if [ -f "main.py" ]; then
          echo "Injecting native runtime bootstrapper into main.py..."
          cat << 'EOF' > main.py.tmp
import sys
import os
import shutil

# Dynamic Runtime Bootstrapper for Pymunk & CFFI
private_dir = os.path.dirname(os.path.abspath(__file__))
runtime_pkgs = os.path.join(private_dir, "_runtime_pkgs")
sys.path.insert(0, runtime_pkgs)

try:
    import pymunk
except ImportError:
    print("Runtime bootstrapper: Unpacking Pymunk bundle...")
    os.makedirs(runtime_pkgs, exist_ok=True)
    import urllib.request
    import tarfile
    
    # Download pure-python fallback compatibility layers natively on device
    try:
        # Download pure-python wheels directly from PyPI archive mirrors
        for pkg in ["pycparser-2.21-py2.py3-none-any.whl", "pymunk-6.10.0.tar.gz"]:
            url = f"https://pythonhosted.org{pkg[0]}/{pkg.split('-')[0]}/{pkg}"
            if "whl" in pkg:
                url = f"https://pythonhosted.org{pkg}"
            
            dst = os.path.join(runtime_pkgs, pkg)
            urllib.request.urlretrieve(url, dst)
            
            if pkg.endswith("tar.gz"):
                with tarfile.open(dst, "r:gz") as tar:
                    tar.extractall(path=runtime_pkgs)
                # Map extracted source folder components into root visibility paths
                src_extracted = os.path.join(runtime_pkgs, "pymunk-6.10.0", "pymunk")
                shutil.move(src_extracted, os.path.join(runtime_pkgs, "pymunk"))
    except Exception as e:
        print(f"Bootstrapper encountered a critical loading exception: {e}")

EOF
          cat main.py >> main.py.tmp
          mv main.py.tmp main.py
        fi

        if [ -f "buildozer.spec" ]; then
          # 2. Reset requirements strictly back to your working pygame baseline.
          sed -i 's|^requirements = .*|requirements = python3==3.10.12,hostpython3==3.10.12,pygame,pyjnius|g' buildozer.spec
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
          sed -i 's|^p4a.local_recipes =.*||g' buildozer.spec
          sed -i 's|^pip_dependencies =.*||g' buildozer.spec
          
          # 3. Clean up old configuration tokens
          sed -i '/^android.api =/d; /^# android.api =/d' buildozer.spec
          sed -i '/^android.minapi =/d; /^# android.minapi =/d' buildozer.spec
          sed -i '/^android.ndk_api =/d; /^# android.ndk_api =/d' buildozer.spec
          sed -i '/^android.build_tools =/d; /^# android.build_tools =/d' buildozer.spec
          sed -i '/^android.gradle_version =/d; /^# android.gradle_version =/d' buildozer.spec
          
          # 4. Append proper production packaging parameters
          echo "" >> buildozer.spec
          echo "android.api = 34" >> buildozer.spec
          echo "android.build_tools = 34.0.0" >> buildozer.spec
          echo "android.minapi = 24" >> buildozer.spec
          echo "android.ndk_api = 24" >> buildozer.spec
          echo "android.gradle_version = 8.0" >> buildozer.spec
        fi

        # 5. Route source downloads safely via GitHub mirrors
        export P4A_pygame_version="main"
        export P4A_pygame_url="git+https://github.com"
        export P4A_python3_url="https://github.com"
        
        # 6. Fast-track Java tool environments
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        export PATH=$JAVA_HOME/bin:$PATH
        export CFLAGS="-Wno-implicit-function-declaration -Wno-error=format-security -fPIC"
        export LDFLAGS="-lm"

        # 7. Compile the app cleanly
        yes | buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
