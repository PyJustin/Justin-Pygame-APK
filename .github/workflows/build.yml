name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Game Code
      uses: actions/checkout@v4

    - name: Fetch Pymunk Build Recipe Natively
      uses: actions/checkout@v4
      with:
        repository: kivy/python-for-android
        path: p4a-temp
        sparse-checkout: |
          pythonforandroid/recipes/pymunk

    - name: Prepare Local Recipe Workspace Structures
      run: |
        mkdir -p p4a-recipes
        mv p4a-temp/pythonforandroid/recipes/pymunk p4a-recipes/
        rm -rf p4a-temp

    - name: Patch buildozer.spec and Compile inside Container
      uses: docker://ghcr.io/kivy/buildozer:latest
      with:
        entrypoint: /bin/bash
        args: >
          -c "
          git config --global --add safe.directory /__w/Justin-Pygame-APK/Justin-Pygame-APK &&
          rm -rf bin/ &&
          rm -rf /github/home/.cache/pip/* &&
          rm -rf /root/.cache/pip/* &&
          /home/user/.venv/bin/pip install --upgrade pip setuptools wheel &&
          /home/user/.venv/bin/pip install pycparser cffi cython &&
          if [ -f 'buildozer.spec' ]; then
            sed -i 's|^requirements = .*|requirements = python3==3.10.12,hostpython3==3.10.12,pygame,pyjnius,pymunk|g' buildozer.spec &&
            sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec &&
            sed -i 's|^#\?p4a.local_recipes =.*|p4a.local_recipes = ./p4a-recipes|g' buildozer.spec;
          fi &&
          export P4A_pygame_version='main' &&
          export P4A_pygame_url='git+https://github.com' &&
          export CFLAGS='-Wno-implicit-function-declaration -Wno-error=format-security' &&
          export P4A_pymunk_version='6.10.0' &&
          if [ -d '.buildozer/android/platform/python-for-android' ]; then
            buildozer android clean;
          else
            rm -rf .buildozer/;
          fi &&
          yes | buildozer -v android debug
          "
      env:
        BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: "1"
        BUILDOZER_WARN_ON_ROOT: "0"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
