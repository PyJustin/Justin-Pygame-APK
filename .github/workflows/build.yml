name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix Safe Directory permissions for Git
      run: |
        git config --global --add safe.directory /__w/Justin-Pygame-APK/Justin-Pygame-APK

    - name: Patch buildozer.spec and Compile
      run: |
        # 1. Clear out local and hidden environment caches to block bad wheels
        rm -rf bin/
        rm -rf /github/home/.cache/pip/*
        rm -rf /root/.cache/pip/*

        # 2. Use your exact working specification logic here
        if [ -f "buildozer.spec" ]; then
          # Insert your EXACT working python / requirements sed modifications here
          sed -i 's|^requirements = .*|requirements = python3==3.10.12,hostpython3==3.10.12,pygame,pyjnius|g' buildozer.spec
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
        fi

        # 3. Your exact working pygame-ce export environment overrides here
        export P4A_pygame_version="main"
        export P4A_pygame_url="git+https://github.com"

        # 4. FIX: Direct Injection of Pymunk into your project directory
        # This bypasses python-for-android entirely and bundles Pymunk inside your APK asset package natively.
        /home/user/.venv/bin/pip install --upgrade pip setuptools wheel
        /home/user/.venv/bin/pip install pycparser cffi cython
        /home/user/.venv/bin/pip install pymunk==6.10.0 --target=.

        # 5. Compile the app cleanly using your original baseline layout
        yes | buildozer -v android debug
      env:
        BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: "1"
        BUILDOZER_WARN_ON_ROOT: "0"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
