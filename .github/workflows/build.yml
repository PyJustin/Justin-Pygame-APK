name: Build Android App with Buildozer
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix Safe Directory permissions for Git
      run: |
        git config --global --add safe.directory /__w/Justin-Pygame-APK/Justin-Pygame-APK

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Patch buildozer.spec and Compile
      run: |
        # 1. Clear out previous workspace directories to prevent artifact contamination
        rm -rf .buildozer/
        rm -rf bin/
        
        if [ -f "buildozer.spec" ]; then
          # 2. Inject explicit matching micro-versions for python3 and hostpython3
          sed -i 's|^requirements = .*|requirements = python3==3.11.9,hostpython3==3.11.9,pygame-ce,pyjnius|g' buildozer.spec
          
          # 3. Pull stable mobile recipes via the master branch
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
        fi
        
        # 4. Compile the application
        yes | buildozer -v android debug
      env:
        BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: "1"
        BUILDOZER_WARN_ON_ROOT: "0"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error

