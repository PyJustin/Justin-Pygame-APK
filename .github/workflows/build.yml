name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Game Code
      uses: actions/checkout@v4

    - name: Fetch Pymunk Build Recipe Natively
      uses: actions/checkout@v4
      with:
        repository: kivy/python-for-android
        path: p4a-temp
        sparse-checkout: |
          pythonforandroid/recipes/pymunk

    - name: Move Recipe Files into Workspace
      run: |
        mkdir -p p4a-recipes
        mv p4a-temp/pythonforandroid/recipes/pymunk p4a-recipes/
        rm -rf p4a-temp

    - name: Set up System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libgdbm-dev libssl-dev libffi-dev cmake gettext \
          libltdl-dev apksigner ccache openjdk-17-jdk

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Build Dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install pycparser cffi cython buildozer

    - name: Patch buildozer.spec and Compile Natively
      run: |
        rm -rf bin/
        rm -rf ~/.cache/pip/*

        if [ -f "buildozer.spec" ]; then
          # Set requirements matching your baseline
          sed -i 's|^requirements = .*|requirements = python3,pygame,pyjnius,pycparser,cffi,pymunk|g' buildozer.spec
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
          sed -i 's|^#\?p4a.local_recipes =.*|p4a.local_recipes = ./p4a-recipes|g' buildozer.spec
        fi

        # 1. Route Pygame-CE variables safely
        export P4A_pygame_version="main"
        export P4A_pygame_url="git+https://github.com"
        export P4A_pymunk_version="6.10.0"
        
        # 2. FIX: Force python-for-android to pull the main runtime source archive from GitHub
        # instead of the broken, unhealthy third-party self-hosted mirror links!
        export P4A_SOURCE_URL="https://github.com"
        export P4A_python3_url="https://github.com"

        # 3. Relax compilation rules for static C bindings
        export CFLAGS="-Wno-implicit-function-declaration -Wno-error=format-security -fPIC"
        export LDFLAGS="-lm"

        # 4. Build cleanly
        yes | buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
