name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix Safe Directory permissions for Git
      run: |
        git config --global --add safe.directory /__w/Justin-Pygame-APK/Justin-Pygame-APK

    - name: Patch buildozer.spec and Compile
      run: |
        # 1. Clear out local and hidden environment caches to block bad wheels
        rm -rf .buildozer/
        rm -rf bin/
        rm -rf /github/home/.cache/pip/*
        rm -rf /root/.cache/pip/*

        # 2. Prepare C-parsing prerequisites natively into the environment 
        mkdir -p /tmp/p4a_host_deps
        pip install pycparser cffi cython --target=/tmp/p4a_host_deps --break-system-packages

        if [ -f "buildozer.spec" ]; then
          # 3. FIX: Keep keyword as 'pygame' to use the native recipe, but we point the URL to pygame-ce below.
          sed -i 's|^requirements = .*|requirements = python3==3.11.10,hostpython3==3.11.10,pygame,pyjnius,pymunk|g' buildozer.spec
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
        fi

        # 4. Redirect the native 'pygame' recipe to pull down Pygame-CE source code
        export P4A_pygame_version="main"
        export P4A_pygame_url="git+https://github.com"

        # 5. Route Pymunk to a modern NDK-compliant version
        export P4A_pymunk_version="6.10.0"

        # 6. Inject the isolated directory into PYTHONPATH for validation loops
        export PYTHONPATH="/tmp/p4a_host_deps:$PYTHONPATH"

        # 7. Compile the app cleanly 
        yes | buildozer -v android debug
      env:
        BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: "1"
        BUILDOZER_WARN_ON_ROOT: "0"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error

