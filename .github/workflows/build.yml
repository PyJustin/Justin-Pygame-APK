name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Game Code
      uses: actions/checkout@v4

    - name: Fetch Pymunk Build Recipe Natively
      uses: actions/checkout@v4
      with:
        repository: kivy/python-for-android
        path: p4a-temp
        sparse-checkout: |
          pythonforandroid/recipes/pymunk

    - name: Move Recipe Files into Workspace
      run: |
        mkdir -p p4a-recipes
        mv p4a-temp/pythonforandroid/recipes/pymunk p4a-recipes/
        rm -rf p4a-temp

    - name: Set up System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libgdbm-dev libssl-dev libffi-dev cmake gettext \
          libltdl-dev apksigner ccache openjdk-17-jdk

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Build Dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install buildozer cython

    - name: Patch buildozer.spec and Compile Natively
      run: |
        rm -rf bin/
        rm -rf ~/.cache/pip/*
        rm -rf pymunk/ cffi/ pycparser/ *.egg-info/

        if [ -f "buildozer.spec" ]; then
          # 1. Enforce python-for-android target requirements
          sed -i 's|^requirements = .*|requirements = python3==3.10.12,hostpython3==3.10.12,pygame,pyjnius,pycparser,cffi,pymunk|g' buildozer.spec
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
          sed -i 's|^#\?p4a.local_recipes =.*|p4a.local_recipes = ./p4a-recipes|g' buildozer.spec
          
          # 2. Clean up old configuration tokens
          sed -i '/^android.api =/d; /^# android.api =/d' buildozer.spec
          sed -i '/^android.minapi =/d; /^# android.minapi =/d' buildozer.spec
          sed -i '/^android.ndk_api =/d; /^# android.ndk_api =/d' buildozer.spec
          sed -i '/^android.build_tools =/d; /^# android.build_tools =/d' buildozer.spec
          sed -i '/^android.gradle_version =/d; /^# android.gradle_version =/d' buildozer.spec
          
          # 3. Append proper production packaging parameters
          echo "" >> buildozer.spec
          echo "android.api = 34" >> buildozer.spec
          echo "android.build_tools = 34.0.0" >> buildozer.spec
          echo "android.minapi = 24" >> buildozer.spec
          echo "android.ndk_api = 24" >> buildozer.spec
          echo "android.gradle_version = 8.0" >> buildozer.spec
        fi

        # 4. Route source downloads safely via GitHub mirrors
        export P4A_pygame_version="main"
        export P4A_pygame_url="git+https://github.com"
        export P4A_python3_url="https://github.com"
        
        # 5. Fast-track Java tool environments
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        export PATH=$JAVA_HOME/bin:$PATH
        export CFLAGS="-Wno-implicit-function-declaration -Wno-error=format-security -fPIC"
        export LDFLAGS="-lm"

        # 6. Bootstrap Buildozer to unpack the isolated hostpython3 runtime binaries
        yes | buildozer android p4a -- --help || true

        # 7. Pre-seed the system level hostpython dependencies
        HOST_PYTHON_BIN=$(find .buildozer/ -name "python" -type f -path "*other_builds/hostpython3*native-build*" | head -n 1)
        if [ -f "$HOST_PYTHON_BIN" ]; then
          echo "Found compiled hostpython binary at: $HOST_PYTHON_BIN"
          curl -sL https://pypa.io -o get-pip.sh
          $HOST_PYTHON_BIN get-pip.sh --break-system-packages || true
          rm -f get-pip.sh
          $HOST_PYTHON_BIN -m pip install pycparser cffi cython --break-system-packages || true
        fi

        # 8. FIX: Force python-for-android to clone and unpack the 'pymunk' workspace repository early.
        # This initializes the .eggs directory footprint before the final compilation runs.
        /opt/hostedtoolcache/Python/3.11.16/x64/bin/python -m pythonforandroid.toolchain download_recipes \
          --requirements=python3==3.10.12,hostpython3==3.10.12,pygame,pyjnius,pycparser,cffi,pymunk \
          --local-recipes=./p4a-recipes || true

        # 9. FIX: Force seed pycparser straight inside every unpacked pymunk/cffi .eggs directory.
        # This guarantees cffi finds pycparser inside its own sandboxed egg folder path!
        EGGS_PATHS=$(find .buildozer/ -name ".eggs" -type d)
        for egg_path in $EGGS_PATHS; do
          if [ -d "$egg_path" ]; then
            echo "Pre-seeding pycparser into dynamic egg container cache at: $egg_path"
            pip install pycparser --target="$egg_path" --break-system-packages || true
            # Also copy inside specific nested folders if setuptools created them early
            CFFI_EGG=$(find "$egg_path" -name "*cffi*.egg" -type d | head -n 1)
            if [ -n "$CFFI_EGG" ]; then
              cp -r "$egg_path/pycparser" "$CFFI_EGG/" || true
            fi
          fi
        done

        # 10. Run the final compilation pass
        yes | buildozer -v android debug
      env:
        PYTHONPATH: "/home/runner/work/Justin-Pygame-APK/Justin-Pygame-APK/p4a-recipes"
