name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Game Code
      uses: actions/checkout@v4

    - name: Fetch Pymunk Build Recipe Natively
      uses: actions/checkout@v4
      with:
        repository: kivy/python-for-android
        path: p4a-temp
        sparse-checkout: |
          pythonforandroid/recipes/pymunk

    - name: Move Recipe Files into Workspace
      run: |
        mkdir -p p4a-recipes
        mv p4a-temp/pythonforandroid/recipes/pymunk p4a-recipes/
        rm -rf p4a-temp

    - name: Build APK via Pre-Bundled Toolchain Action
      # This action features fully pre-baked SDK/NDK layouts, completely bypassing external 503 mirror downloads
      uses: ArtemSBulgakov/buildozer-action@v1
      id: buildozer
      with:
        buildozer_version: stable
        command: |
          # 1. Inject dependencies natively into the pipeline virtual environment
          pip install --upgrade pip setuptools wheel
          pip install pycparser cffi cython
          
          # 2. Patch your requirements configuration baseline
          if [ -f "buildozer.spec" ]; then
            sed -i 's|^requirements = .*|requirements = python3,pygame,pyjnius,pycparser,cffi,pymunk|g' buildozer.spec
            sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
          fi
          
          # 3. Apply Environment overrides for Pygame-CE and Pymunk Compilation
          export P4A_pygame_version="main"
          export P4A_pygame_url="git+https://github.com"
          export P4A_pymunk_version="6.10.0"
          
          # 4. Relax compiler rules for static Chipmunk C libraries
          export CFLAGS="-Wno-implicit-function-declaration -Wno-error=format-security -fPIC"
          export LDFLAGS="-lm"
          
          # 5. Bootstrap buildozer tools to build recipe maps
          yes | buildozer android p4a -- --help || true
          
          # 6. Override the internal python-for-android recipe directory with our modern script
          P4A_RECIPE_DIR=$(find / -name "recipes" -type d -path "*pythonforandroid*" | head -n 1)
          if [ -d "$P4A_RECIPE_DIR" ] && [ -d "p4a-recipes/pymunk" ]; then
            cp -r p4a-recipes/pymunk "$P4A_RECIPE_DIR/"
          fi
          
          # 7. Compile the app cleanly
          yes | buildozer android debug
        repository_owner: ${{ github.repository_owner }}

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: ${{ steps.buildozer.outputs.filename }}
        if-no-files-found: error
