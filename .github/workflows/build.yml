name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix Safe Directory permissions for Git
      run: |
        git config --global --add safe.directory /__w/Justin-Pygame-APK/Justin-Pygame-APK

    - name: Patch buildozer.spec and Compile
      run: |
        # 1. Clear out previous environments
        rm -rf .buildozer/
        rm -rf bin/

        if [ -f "buildozer.spec" ]; then
          # 2. Bind to the native recipe framework
          sed -i 's|^requirements = .*|requirements = python3==3.11.0,hostpython3==3.11.0,pygame,pyjnius|g' buildozer.spec
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
        fi

        # 3. Target the pygame-ce codebase
        export P4A_pygame_version="main"
        export P4A_pygame_url="git+https://github.com"

        # 4. FIX 'longintrepr.h' MISSING: Inject internal Python header locations 
        # so the C cross-compiler can resolve pygame-ce internal hooks cleanly.
        PY_INC_DIR="/__w/Justin-Pygame-APK/Justin-Pygame-APK/.buildozer/android/platform/build-arm64-v8a/build/other_builds/python3/arm64-v8a__ndk_target_31/python3/android-build/android-root/include/python3.11"
        export CFLAGS="-I$PY_INC_DIR -I$PY_INC_DIR/internal"
        export CXXFLAGS="-I$PY_INC_DIR -I$PY_INC_DIR/internal"

        # 5. Compile the app
        yes | buildozer -v android debug
      env:
        BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: "1"
        BUILDOZER_WARN_ON_ROOT: "0"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
