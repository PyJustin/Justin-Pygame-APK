name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libtool \
            autoconf \
            automake \
            pkg-config \
            gawk \
            git \
            ccache \
            unzip \
            zip \
            bzip2 \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            libstdc++6 \
            aidl

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Accept Licenses & Build with Buildozer
        run: |
          # 1. Accept all android licenses natively on the runner
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

          # 2. Tell buildozer exactly where the pre-installed SDK & NDK are.
          # This forces Buildozer to bypass its own internal downloader scripts entirely.
          buildozer -v android debug
        env:
          BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: 1
          BUILDOZER_WARN_ON_ROOT: 0
          # Re-route Buildozer targeting parameters to GitHub Actions native installations
          PATH: ${{ env.ANDROID_HOME }}/cmdline-tools/latest/bin:${{ env.ANDROID_HOME }}/platform-tools:${{ env.PATH }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: .bin/*.apk
