name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix Safe Directory permissions for Git
      run: |
        git config --global --add safe.directory /__w/Justin-Pygame-APK/Justin-Pygame-APK

    - name: Patch buildozer.spec and Compile
      run: |
        # 1. Clear out local and hidden environment caches to block bad wheels
        rm -rf bin/
        rm -rf /github/home/.cache/pip/*
        rm -rf /root/.cache/pip/*

        # 2. Inject compilation dependencies right inside the active virtual environment
        /home/user/.venv/bin/pip install --upgrade pip setuptools wheel
        /home/user/.venv/bin/pip install pycparser cffi cython

        if [ -f "buildozer.spec" ]; then
          # 3. FIX: Remove pymunk from core requirements so p4a create step passes.
          sed -i 's|^requirements = .*|requirements = python3,pygame,pyjnius|g' buildozer.spec
          
          # 4. FIX: Inject pymunk as a pip dependency instead to bypass the broken p4a recipe hook.
          # If pip_dependencies doesn't exist or is commented out, we replace it.
          sed -i 's|^#\?pip_dependencies = .*|pip_dependencies = pymunk==6.10.0|g' buildozer.spec
          
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
        fi

        # 5. Point the native pygame recipe to pull down your working Pygame-CE source code
        export P4A_pygame_version="main"
        export P4A_pygame_url="git+https://github.com"

        # 6. Relax compilation strictness for C-bindings
        export CFLAGS="-Wno-implicit-function-declaration -Wno-error=format-security"

        # 7. Clean up old platform cache chunks if present
        if [ -d ".buildozer/android/platform/python-for-android" ]; then
          buildozer android clean
        else
          rm -rf .buildozer/
        fi

        # 8. Compile the app cleanly 
        yes | buildozer -v android debug
      env:
        BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: "1"
        BUILDOZER_WARN_ON_ROOT: "0"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
