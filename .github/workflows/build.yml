name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Game Code
      uses: actions/checkout@v4

    - name: Set up System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libgdbm-dev libssl-dev libffi-dev cmake gettext \
          libltdl-dev apksigner ccache openjdk-17-jdk

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Build Dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install buildozer cython

    - name: Patch buildozer.spec and Compile Natively
      run: |
        rm -rf bin/
        rm -rf ~/.cache/pip/*

        # 1. FIX: Force install pycparser, cffi, and pymunk locally into your game's root directory.
        # This downloads pre-compiled modern binary wheels straight from PyPI via GitHub's working connection,
        # completely bypassing python-for-android's broken 503 recipe download servers!
        pip install --target=. pycparser cffi pymunk==6.10.0

        if [ -f "buildozer.spec" ]; then
          # 2. FIX: Reset requirements strictly back to your working pygame baseline.
          # Removing pymunk/cffi here forces python-for-android to bypass the unhealthy servers completely.
          sed -i 's|^requirements = .*|requirements = python3,pygame,pyjnius|g' buildozer.spec
          sed -i 's|^#\?p4a.branch =.*|p4a.branch = master|g' buildozer.spec
          
          # Ensure local recipes lines are turned off to prevent path confusion
          sed -i 's|^p4a.local_recipes =.*||g' buildozer.spec
        fi

        # 3. Route Pygame-CE variables safely
        export P4A_pygame_version="main"
        export P4A_pygame_url="git+https://github.com"
        
        # Relax compilation strictness for static C bindings
        export CFLAGS="-Wno-implicit-function-declaration -Wno-error=format-security -fPIC"
        export LDFLAGS="-lm"

        # 4. Build cleanly
        yes | buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
