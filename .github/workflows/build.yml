name: Build Android App with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libtool \
          autoconf \
          automake \
          pkg-config \
          gawk \
          git \
          ccache \
          unzip \
          zip \
          bzip2 \
          libffi-dev \
          libssl-dev \
          libltdl-dev \
          libstdc++6 \
          libgtk-3-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          zlib1g-dev \
          cmake \
          aidl

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Stable Buildozer Environment
      run: |
        python -m pip install --upgrade pip
        pip install "buildozer==1.5.0" "cython<3.0.0" wheel "sh<2.0"

    - name: Force Purge Buildozer and Pip Caches
      run: |
        rm -rf .buildozer/
        rm -rf ~/.buildozer/
        rm -rf ~/.cache/pip

    - name: Link Legacy SDK Paths & Compile
      run: |
        # Accept licenses for the pre-installed system SDK
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # Pre-build Buildozer's internal expected directory structure to bypass the check
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        
        # Create a hard symbolic link so Buildozer finds the modern working sdkmanager where it expects it
        ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
        
        # Build using specific target parameters to force standard C compilation routines
        buildozer -v android debug \
          --android.sdk_path="$ANDROID_HOME" \
          --android.ndk_path="$ANDROID_NDK_HOME" \
          --android.requirements="python3,pygame,pyjnius" \
          --p4a.branch="master" \
          --p4a.bootstrap="sdl2" \
          --android.archs="arm64-v8a"
      env:
        BUILDOZER_ALLOW_ORG_DOCS_AND_ROOT: 1
        BUILDOZER_WARN_ON_ROOT: 0

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
